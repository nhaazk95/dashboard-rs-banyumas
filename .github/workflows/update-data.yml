name: Update Hospital Reviews Data

on:
  schedule:
    # Tiap 6 jam -- near-live, tapi MAX_REVIEWS_PER_RS di scrape_update.py
    # sudah dikecilkan supaya tetap hemat kredit Apify.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # bisa di-trigger manual dari tab "Actions"

permissions:
  contents: write   # perlu untuk commit & push balik ke repo

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -U apify-client requests

      - name: Run scraper + classifier
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/scrape_update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/reviews.json
          git diff --quiet --cached || git commit -m "Update data ulasan RS ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Selaraskan dengan remote sebelum push, supaya tidak gagal
          # kalau ada commit lain masuk ke main di antara checkout dan push.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Push gagal (percobaan $i), retry dalam 5 detik..."
            sleep 5
          done